name = "legado-checkout-dev"
main = "src/index.js"
compatibility_date = "2026-01-01"
# Requerido por @microlabs/otel-cf-workers (OpenTelemetry). Con compatibility_date
# posterior a 2024-09-23 ya incluye el comportamiento de nodejs_compat_v2.
compatibility_flags = ["nodejs_compat"]

# URL pública *.workers.dev deshabilitada: el Worker solo responde en
# api.legadoholding.com, así las reglas de firewall / rate limiting de la zona
# no se pueden saltar entrando por workers.dev. Para pruebas, `wrangler dev`.
workers_dev = false

routes = [
  { pattern = "api.legadoholding.com/*", zone_name = "legadoholding.com" }
]


# Variables públicas (no son secretos). Editar aquí cualquier valor que NO
# requiera estar cifrado.
[vars]
ENVIRONMENT = "dev"

# Identidad del despliegue. "lh" = LEGADO Holding. Un futuro despliegue para
# Funeraria del Zulia usará TENANT = "fdz". Lo consumen: prevision-api.js (path
# /api/public/t/<tenant>), las líneas de log y
# (a futuro) el service.name de OpenTelemetry. Ver worker/src/tenant.js.
TENANT = "lh"

# API pública de Prevision-Funeraria (reemplaza a Invoice Ninja para el
# wizard de planes). El token se inyecta con `wrangler secret put PF_TOKEN`.
PF_BASE = "https://app.previsionfuneraria.com"

# Base pública del sitio — se usa para armar success_url/cancel_url del
# checkout con tarjeta (Stripe Checkout) al llamar POST /compras. Este mismo
# wrangler.toml es el que se despliega a producción (route api.legadoholding.com),
# así que el valor por defecto debe ser el dominio real; para probar en local
# contra `gracias.html`/`cancelado.html` servidos en localhost, sobreescribir
# SITE_BASE_URL en worker/.dev.vars.
SITE_BASE_URL = "https://www.legadoholding.com"

# Lista CSV de orígenes (esquema + host + puerto) autorizados a hacer
# requests con CORS. El Worker hace eco del Origin entrante solo si está
# en esta lista; cualquier otro origen recibe respuesta sin Access-Control-
# Allow-Origin y el navegador bloquea la lectura. Usa "*" para abrir todo
# (NO recomendado en prod). Requests sin Origin (curl/PowerShell) pasan
# siempre porque no son sujetas a CORS.
# Solo producción. Los orígenes localhost para desarrollo van en worker/.dev.vars
# (ver .dev.vars.example), que `wrangler dev` usa en lugar de este valor.
ALLOWED_ORIGINS = "https://legadoholding.com,https://www.legadoholding.com"

# Modelo de OpenAI que ejecuta el agente Alma directamente en el Worker.
# Ya no se llama a n8n: el loop de function calling vive en src/alma.js.
# Cambiar aquí si quieres probar otro modelo.
# El secret se carga con: cd worker && wrangler secret put OPENAI_API_KEY
OPENAI_MODEL = "gpt-5.6-luna"

# Rate Limiting de Workers (ver src/ratelimit.js). namespace_id es un entero
# arbitrario propio de esta cuenta; period solo admite 10 o 60 segundos.
# /chat: 20 mensajes por minuto por IP (el tope de mensajes por conversación
# lo configura el administrador en Previsión — parametros.max_mensajes_por_conversacion
# de Asistente del sitio; 60 por defecto, ver src/alma.js).
[[ratelimits]]
name = "CHAT_IP_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 20
  period = 60

# POST / (checkout del wizard): 10 intentos por minuto por IP. Cada uno crea una
# compra pendiente en Previsión y una sesión de pago de Stripe.
[[ratelimits]]
name = "CHECKOUT_IP_LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 10
  period = 60

# GET /wizard/parentescos y /wizard/vendedor: 60 por minuto por IP. Consultan
# a Previsión con el token (además van con caché en el edge).
[[ratelimits]]
name = "LOOKUP_IP_LIMITER"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 60
  period = 60

# Observability deshabilitado explícito. En wrangler 4.x se activaba por
# defecto y requiere entitlement del plan; sin él el deploy fallaba con
# code 10007 entitlements.not_available.
[observability]
enabled = false
