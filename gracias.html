<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>¡Gracias! — LEGADO</title>
        <meta name="robots" content="noindex" />
        <link rel="icon" type="image/png" href="images/LogoLegado.png" />
        <style>
            :root {
                --legado-navy: #263c5b;
                --legado-warm-white: #f3f2ee;
                --ink: #17243a;
            }
            * { box-sizing: border-box; }
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--legado-warm-white);
                color: var(--ink);
                font-family: Inter, Arial, sans-serif;
                padding: 1.5rem;
            }
            .card {
                max-width: 32rem;
                width: 100%;
                background: #fff;
                border-radius: 1rem;
                padding: 2.5rem 2rem;
                text-align: center;
                box-shadow: 0 10px 30px rgba(23, 36, 58, 0.12);
            }
            .icon {
                width: 3.5rem;
                height: 3.5rem;
                margin: 0 auto 1.25rem;
                color: #22c55e;
            }
            h1 { font-size: 1.5rem; margin: 0 0 0.75rem; color: var(--legado-navy); }
            p { line-height: 1.6; margin: 0 0 1.5rem; }
            a.btn {
                display: inline-block;
                background: var(--legado-navy);
                color: #fff;
                text-decoration: none;
                padding: 0.75rem 1.5rem;
                border-radius: 0.5rem;
                font-weight: 600;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="9 12 11 14 15 10"/></svg>
            <h1>¡Gracias por confiar en LEGADO!</h1>
            <p>
                Recibimos tu pago. En unos minutos vas a recibir un correo con la
                confirmación de tu plan de previsión. Si tienes alguna duda, nuestro
                equipo está disponible para acompañarte.
            </p>
            <a class="btn" href="/">Volver al inicio</a>
        </div>
    </body>
</html>
